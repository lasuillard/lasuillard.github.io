fail_fast: true
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        language: system
        types_or: [javascript, ts, svelte]
        entry: npm exec -- eslint
        args: [--fix]

      - id: prettier
        name: prettier
        language: system
        types_or: [javascript, ts, svelte, json, yaml]
        entry: npm exec -- prettier
        args: [--write]

      - id: sveltekit-sync
        name: sveltekit-sync
        language: system
        types_or: [javascript, ts, svelte]
        pass_filenames: false
        entry: npm exec -- svelte-kit sync

      - id: svelte-check
        name: svelte-check
        language: system
        types_or: [javascript, ts, svelte]
        pass_filenames: false
        entry: npm exec -- svelte-check
        args: [--tsconfig, ./tsconfig.json]

      - id: vitest
        name: vitest
        language: system
        types_or: [javascript, ts, svelte]
        pass_filenames: false
        entry: npm run test
